fragment ALNotificationOption on NotificationOption {
    type
    enabled
}

fragment ALAiringNotification on AiringNotification {
    id
    animeId
    episode
    media {
        title {
                ...MediaTitle
        }
        coverImage {
            large
        }
    }
    createdAt
}

fragment ALFollowingNotification on FollowingNotification {
    id
    user {
        ...ALUserShort
    }
    createdAt
}

fragment ALActivityMessageNotification on ActivityMessageNotification {
    id
    user {
        ...ALUserShort
    }
    message {
        id
        message(asHtml: true)
        recipient {
            ...ALUserShort
        }
    }
    createdAt
}

fragment ALActivityMentionNotification on ActivityMentionNotification {
    id
    user {
        ...ALUserShort
    }
    activity { ...ALNotificationActivity }
    createdAt
}

fragment ALActivityReplyNotification on ActivityReplyNotification {
    id
    user {
        ...ALUserShort
    }
    activity { ...ALNotificationActivity }
    createdAt
}

fragment ALActivityReplySubscribedNotification on ActivityReplySubscribedNotification {
    id
    user {
        ...ALUserShort
    }
    activity { ...ALNotificationActivity }
    createdAt
}

fragment ALActivityLikeNotification on ActivityLikeNotification {
    id
    user {
        ...ALUserShort
    }
    activity { ...ALNotificationActivity }
    createdAt
}

fragment ALActivityReplyLikeNotification on ActivityReplyLikeNotification {
    id
    activityId
    userId
    user {
        ...ALUserShort
    }
    activity { ...ALNotificationActivity }
    createdAt
}

